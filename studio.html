<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Witte Studio Achtergrond</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background: #f2f2f7;
      color: #1c1c1e;
      padding: 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }

    .subtitle {
      text-align: center;
      color: #8e8e93;
      font-size: 15px;
      margin-bottom: 28px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.06);
      margin-bottom: 16px;
    }

    /* Grote upload zone – goed voor iPhone */
    .upload-zone {
      border: 2.5px dashed #c7c7cc;
      border-radius: 16px;
      padding: 36px 20px;
      text-align: center;
      background: #fafafa;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .upload-zone:active {
      background: #f0f0f5;
      border-color: #007aff;
    }

    .upload-zone.has-image {
      border-style: solid;
      border-color: #34c759;
      background: #f0fff4;
      padding: 12px;
    }

    .upload-icon {
      font-size: 42px;
      margin-bottom: 12px;
      line-height: 1;
    }

    .upload-text {
      font-size: 17px;
      font-weight: 600;
      color: #1c1c1e;
      margin-bottom: 6px;
    }

    .upload-hint {
      font-size: 14px;
      color: #8e8e93;
    }

    input[type="file"] {
      display: none;
    }

    #preview {
      width: 100%;
      max-height: 45vh;
      object-fit: contain;
      border-radius: 12px;
      display: none;
      background: #fff;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 17px 16px;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      margin-top: 14px;
      transition: opacity 0.15s;
    }

    .btn:active {
      opacity: 0.75;
    }

    .btn-primary {
      background: #007aff;
      color: #ffffff;
    }

    .btn-primary:disabled {
      background: #b0d0ff;
      color: #ffffff;
    }

    .btn-success {
      background: #34c759;
      color: #ffffff;
    }

    .btn-secondary {
      background: #e5e5ea;
      color: #1c1c1e;
    }

    .status {
      text-align: center;
      font-size: 15px;
      color: #8e8e93;
      margin: 14px 0 4px;
      min-height: 22px;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2.5px solid #007aff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      vertical-align: -3px;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #result {
      width: 100%;
      max-height: 50vh;
      object-fit: contain;
      border-radius: 12px;
      background: #ffffff;
      display: none;
      margin-bottom: 4px;
    }

    .result-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }

    .hidden {
      display: none !important;
    }

    .tip {
      text-align: center;
      font-size: 13px;
      color: #aeaeb2;
      margin-top: 20px;
      line-height: 1.4;
      padding: 0 10px;
    }
  </style>
</head>
<body>

  <h1>Witte Studio Achtergrond</h1>
  <p class="subtitle">Voor Marktplaats • iPhone-vriendelijk</p>

  <!-- Upload sectie -->
  <div class="card" id="uploadCard">
    <div class="upload-zone" id="uploadZone">
      <div class="upload-icon">📷</div>
      <div class="upload-text">Tik om foto te kiezen</div>
      <div class="upload-hint">Of maak direct een nieuwe foto</div>
    </div>

    <input type="file" id="fileInput" accept="image/*" capture="environment">

    <img id="preview" alt="Gekozen foto">

    <button id="processBtn" class="btn btn-primary" disabled>
      Maak witte achtergrond
    </button>

    <div class="status" id="status"></div>
  </div>

  <!-- Resultaat sectie -->
  <div class="card hidden" id="resultCard">
    <img id="result" alt="Resultaat met witte achtergrond">

    <div class="result-actions">
      <button id="downloadBtn" class="btn btn-success">
        💾 Download foto
      </button>
      <button id="newBtn" class="btn btn-secondary">
        Nieuwe foto
      </button>
    </div>
  </div>

  <p class="tip">
    Tip: de eerste keer laadt er even een AI-model (~40 MB).<br>
    Daarna werkt het sneller.
  </p>

  <script type="module">
    import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/index.js";

    const uploadZone  = document.getElementById('uploadZone');
    const fileInput   = document.getElementById('fileInput');
    const preview     = document.getElementById('preview');
    const processBtn  = document.getElementById('processBtn');
    const status      = document.getElementById('status');
    const resultCard  = document.getElementById('resultCard');
    const resultImg   = document.getElementById('result');
    const downloadBtn = document.getElementById('downloadBtn');
    const newBtn      = document.getElementById('newBtn');

    let currentFile = null;
    let resultBlob  = null;

    // Grote klikbare zone opent de bestandenkiezer
    uploadZone.addEventListener('click', () => {
      fileInput.click();
    });

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // Reset
      resultCard.classList.add('hidden');
      status.textContent = '';
      processBtn.disabled = true;

      // Toon preview
      const url = URL.createObjectURL(file);
      preview.src = url;
      preview.style.display = 'block';
      uploadZone.classList.add('has-image');
      uploadZone.querySelector('.upload-icon').textContent = '✅';
      uploadZone.querySelector('.upload-text').textContent = 'Foto geselecteerd';
      uploadZone.querySelector('.upload-hint').textContent = 'Tik opnieuw om andere foto te kiezen';

      // Verklein grote foto’s voor betere prestaties op iPhone
      try {
        currentFile = await resizeImage(file, 1600);
        processBtn.disabled = false;
      } catch (err) {
        status.textContent = 'Kon foto niet laden';
        console.error(err);
      }
    });

    // Verklein afbeelding zodat iPhone niet crasht bij grote foto’s
    function resizeImage(file, maxSize) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;

          if (width <= maxSize && height <= maxSize) {
            resolve(file); // al klein genoeg
            return;
          }

          if (width > height) {
            height = Math.round(height * (maxSize / width));
            width = maxSize;
          } else {
            width = Math.round(width * (maxSize / height));
            height = maxSize;
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          canvas.toBlob((blob) => {
            if (blob) {
              resolve(new File([blob], file.name, { type: 'image/jpeg' }));
            } else {
              reject(new Error('Resize mislukt'));
            }
          }, 'image/jpeg', 0.9);
        };
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }

    processBtn.addEventListener('click', async () => {
      if (!currentFile) return;

      processBtn.disabled = true;
      status.innerHTML = '<span class="spinner"></span>Achtergrond verwijderen… even geduld';

      try {
        // Achtergrond verwijderen
        const transparentBlob = await removeBackground(currentFile, {
          output: {
            format: 'image/png',
            quality: 0.92
          }
        });

        // Zet op pure witte achtergrond
        const img = new Image();
        img.src = URL.createObjectURL(transparentBlob);

        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
        });

        const canvas = document.createElement('canvas');
        canvas.width  = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');

        // Pure wit
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0);

        resultBlob = await new Promise(resolve =>
          canvas.toBlob(resolve, 'image/png', 0.95)
        );

        // Toon resultaat
        resultImg.src = URL.createObjectURL(resultBlob);
        resultImg.style.display = 'block';
        resultCard.classList.remove('hidden');
        status.textContent = 'Klaar! ✓';

        // Scroll naar resultaat
        resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });

      } catch (err) {
        console.error(err);
        status.textContent = 'Fout: ' + (err.message || 'Kon achtergrond niet verwijderen. Probeer een andere foto.');
      } finally {
        processBtn.disabled = false;
      }
    });

    downloadBtn.addEventListener('click', () => {
      if (!resultBlob) return;

      const a = document.createElement('a');
      a.href = URL.createObjectURL(resultBlob);
      a.download = 'marktplaats-wit-' + Date.now() + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });

    newBtn.addEventListener('click', () => {
      // Reset alles
      fileInput.value = '';
      currentFile = null;
      resultBlob = null;

      preview.style.display = 'none';
      preview.src = '';
      resultImg.style.display = 'none';
      resultImg.src = '';

      uploadZone.classList.remove('has-image');
      uploadZone.querySelector('.upload-icon').textContent = '📷';
      uploadZone.querySelector('.upload-text').textContent = 'Tik om foto te kiezen';
      uploadZone.querySelector('.upload-hint').textContent = 'Of maak direct een nieuwe foto';

      processBtn.disabled = true;
      status.textContent = '';
      resultCard.classList.add('hidden');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>
</html>
